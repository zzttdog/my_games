<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的游戏 · 选择对战模式</title>
<style>
  :root {
    --bg: #0e1218;
    --panel: #171e28;
    --panel-hover: #1d2733;
    --line: #2a3543;
    --text: #e8edf4;
    --muted: #8d9bad;
    --green: #7fc8a0;
    --gold: #d9b26a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2634 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 70px;
  }
  header { text-align: center; margin-bottom: 38px; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 1px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 360px));
    gap: 24px;
    width: 100%;
    max-width: 800px;
  }
  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
  }
  .card.harmonies::before { background: linear-gradient(90deg, var(--green), #4a8f8a); }
  .card.castle::before    { background: linear-gradient(90deg, #f2ece1, var(--gold)); }
  h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  a.mode {
    display: block; border-radius: 10px; padding: 12px 13px;
    text-decoration: none; border: 1px solid var(--line);
    background: #121a24; transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  a.mode:hover { transform: translateY(-2px); }
  a.mode b { display: block; font-size: 13px; color: var(--text); margin-bottom: 5px; }
  a.mode span { display: block; font-size: 11px; color: var(--muted); line-height: 1.6; }
  a.mode.solo:hover { border-color: #4a5a6d; background: #1b2531; }
  a.mode.pvp { border-color: #2f5c4a; background: #152921; }
  a.mode.pvp b { color: var(--green); }
  a.mode.pvp:hover { border-color: var(--green); background: #1b332a; }
  footer { margin-top: 40px; color: #8d9bad; font-size: 12px; text-align: center; line-height: 2; max-width: 760px; }
  .rule { margin-top: 16px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px;
          background: #141c26; font-size: 12px; line-height: 2; color: #a9b6c6; text-align: left; max-width: 760px; }
  .rule b { color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>我的游戏</h1>
</header>

<div class="grid" id="gameGrid">
  <div class="card harmonies">
    <h2>Harmonies</h2>
    <p class="sub">自然和弦（含律动扩）</p>
    <div class="modes">
      <a class="mode solo" href="./Harmonies/index.html">
        <b>玩家 vs AI</b><span>单机 · 可选 2/3/4 人</span>
      </a>
      <a class="mode pvp" href="./net/client/play.html?game=harmonies">
        <b>玩家 vs 玩家</b><span>联机 · 4 位房间号</span>
      </a>
    </div>
  </div>

  <div class="card castle">
    <h2>The White Castle</h2>
    <p class="sub">姬路城 + 茶道扩 Matcha</p>
    <div class="modes">
      <a class="mode solo" href="./The White Castle/index.html"
         data-desk="./The White Castle/index.html" data-phone="./net/client/phone.html?game=castle">
        <b>玩家 vs AI</b><span>单机 · 可选 AI 难度</span>
      </a>
      <a class="mode pvp" href="./net/client/play.html?game=castle">
        <b>玩家 vs 玩家</b><span>联机 · 4 位房间号</span>
      </a>
    </div>
  </div>
</div>

<div class="rule">
  <b>联机</b>：房主创建房间并把邀请链接发给对方；人齐后由房主点「开始对局」。<br>
  <b>开局规则</b>由房主统一设定，所有窗口一致；AI 只由房主窗口代跑。
</div>

<footer>
  <span style="color:#e6c89a">纯静态站点只支持同一浏览器、同一站点的多窗口联机；跨设备联机请另起 Node 服务。</span>
</footer>

<script>
/* 游戏卡片优先由根目录 games.json 渲染；fetch 失败时保留上面的静态兜底。
   窄屏（手机 / 平板竖屏）把需要缩放外壳的单机入口切到 net/client/phone.html。 */
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cardHtml(g) {
    var soloHref = g.entry;
    var phoneAttr = '';
    if (g.phoneShell && g.phoneEntry) {
      phoneAttr = ' data-desk="' + esc(g.entry) + '" data-phone="' + esc(g.phoneEntry) + '"';
    }
    return '<div class="card ' + esc(g.theme || '') + '">' +
      '<h2>' + esc(g.title || '') + '</h2>' +
      '<p class="sub">' + esc(g.subtitle || '') + '</p>' +
      '<div class="modes">' +
        '<a class="mode solo" href="' + esc(soloHref) + '"' + phoneAttr + '>' +
          '<b>' + esc(g.soloLabel || '玩家 vs AI') + '</b><span>' + esc(g.soloNote || '') + '</span>' +
        '</a>' +
        '<a class="mode pvp" href="' + esc(g.netEntry || '') + '">' +
          '<b>' + esc(g.pvpLabel || '玩家 vs 玩家') + '</b><span>' + esc(g.pvpNote || '') + '</span>' +
        '</a>' +
      '</div>' +
    '</div>';
  }
  function render(cfg) {
    var list = cfg && cfg.games ? Object.keys(cfg.games).map(function (k) {
      return Object.assign({ key: k }, cfg.games[k]);
    }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }) : [];
    if (!list.length) return;
    var grid = document.getElementById('gameGrid');
    grid.innerHTML = list.map(cardHtml).join('');
  }
  var mq = window.matchMedia('(max-width: 820px)');
  function syncPhone() {
    var links = document.querySelectorAll('[data-phone]');
    for (var i = 0; i < links.length; i++) {
      links[i].setAttribute('href', mq.matches ? links[i].getAttribute('data-phone')
                                                : links[i].getAttribute('data-desk'));
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', syncPhone);
  else if (mq.addListener) mq.addListener(syncPhone);
  syncPhone();
  fetch('games.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (cfg) { render(cfg); syncPhone(); })
    .catch(function () { /* 静态兜底 */ });
})();
</script>

</body>
</html>
